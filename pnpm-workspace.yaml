allowBuilds:
  # postinstall do protobufjs (dependência do onnxruntime-web) só confere versões
  protobufjs: false
  # canvas (dependência opcional do playcanvas, só para Node): o navegador não usa
  canvas: false
  # wrangler (deploy da versão web): instalam o binário de cada plataforma
  esbuild: true
  workerd: true

[package]
name = "splatforge"
version = "0.5.0"
description = "Orbit video → Gaussian Splatting, 100% local"
authors = ["Bryan Diniz"]
license = "MIT"
repository = "https://github.com/obraia/gausify-orbit"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "splatforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time", "fs", "signal"] }
tokio-util = "0.7"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
# Native TLS (SChannel on Windows, Security.framework on macOS): no C code
# to compile on the build machine.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "stream", "json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.10"
futures-util = "0.3.34"
# .sog textures: libwebp built from source (cc), nothing to install.
# ~18% smaller output than the pure-Rust encoder (image-webp), which does LZ77 poorly.
libwebp-sys = "0.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Masking on Windows: MODNet/BiRefNet/RMBG with ONNX Runtime (static) + DirectML.dll.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "directml", "api-27"] }

# Masking on macOS (Apple Silicon): RMBG-1.4 with ONNX Runtime (static) + CoreML.
# pyke only publishes CoreML-enabled binaries for aarch64-apple-darwin.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "coreml", "api-27"] }

# Frame decoding/sharpness runs on every candidate frame; keep it fast in dev builds too.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

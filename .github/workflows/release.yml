# Builds the installers (Windows: NSIS .exe, macOS: .dmg) and uploads them to
# a draft release. Trigger it by pushing a `v*` tag or with the
# "Run workflow" button in the Actions tab.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest # Apple Silicon
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # The Brush sidecar is built from the pinned commit + the web patches; the
      # cache skips the rebuild when none of that changed (the `.rev` file next
      # to the binary makes setup:tools skip compilation).
      - uses: actions/cache@v4
        with:
          path: src-tauri/binaries/brush_app-*
          key: brush-native-${{ runner.os }}-${{ hashFiles('scripts/build-brush-web.mjs', 'web/brush/*.patch') }}

      # Bundled in the installer: Brush (sidecar) and, on Windows, DirectML.dll.
      # COLMAP, ffmpeg and the masking model are downloaded by the app on first use.
      - run: pnpm setup:tools --only bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: Gausify Orbit ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseBody: |
            Windows: download the `*-setup.exe`. On first run the app offers to
            install COLMAP and ffmpeg (≈ 590 MB with CUDA).
            macOS: download the `.dmg` and install the dependencies with `brew install ffmpeg colmap`.
          releaseDraft: true
          prerelease: false

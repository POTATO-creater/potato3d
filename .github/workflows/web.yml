# Web version: checks on every push and PR; deploys to Cloudflare
# (wrangler.jsonc) when `main` moves. The desktop app ships via release.yml.

name: web

on:
  push:
    branches: [main]
  pull_request:

# Two back-to-back pushes to `main` must not deploy out of order: the second
# cancels the first, so the newest commit is what ends up live.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Brush as WASM (web/pkg, not in git). A clean build takes ~25 min, so it
      # only runs when the pinned Brush commit or the patches change; the
      # script installs the Rust toolchain it needs by itself.
      - id: brush
        uses: actions/cache/restore@v6
        with:
          path: web/pkg
          key: brush-pkg-${{ hashFiles('scripts/build-brush-web.mjs', 'web/brush/*.patch') }}

      - if: steps.brush.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - if: steps.brush.outputs.cache-hit != 'true'
        run: pnpm web:wasm

      # Save right away, not at the end of the job: `actions/cache` only saved
      # when everything passed, so a later failure (e.g. the deploy) threw the build away.
      - if: steps.brush.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: web/pkg
          key: ${{ steps.brush.outputs.cache-primary-key }}

      - run: pnpm exec tsc --noEmit -p web

      # Share-link Worker (worker/index.ts).
      - run: pnpm exec tsc --noEmit -p worker

      - run: pnpm test:web

      # Building here keeps a broken build from only surfacing at deploy time,
      # and PRs never deploy, so this is where it would be caught.
      - run: pnpm web:build

      # Workers rejects files over 25 MiB. The ONNX Runtime .wasm (~27 MB)
      # ships gzipped (web/ort-wasm-plugin.ts); if an update brings another
      # large file, the error shows up here, not at deploy time.
      - name: No file over 25 MiB
        run: |
          big=$(find dist-web -type f -size +25M)
          if [ -n "$big" ]; then echo "Files too large for Workers:"; echo "$big"; exit 1; fi

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
